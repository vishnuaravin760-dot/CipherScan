name: Build Cipher Scan APK

on:
  workflow_dispatch:
    inputs:
      mac_test:
        description: 'Build MAC Test app (target 31)'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SCAN_MAC_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_test && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native tools
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find . -maxdepth 1 -type f -name 'CipherScan*.zip'
          )

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Upload exactly one CipherScan project ZIP to the repository root."
            exit 1
          fi

          unzip -q "${archives[0]}" -d extracted

          if [ ! -f extracted/CipherScan/app/build.gradle ]; then
            echo "CipherScan project was not found inside the ZIP."
            exit 1
          fi

          if [ "$SCAN_MAC_TEST" = true ]; then
