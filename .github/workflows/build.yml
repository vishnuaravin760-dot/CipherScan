name: Build Cipher Scan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'CipherScan*.zip')

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Upload exactly one CipherScan project ZIP to the repository root."
            exit 1
          fi

          unzip -q "${archives[0]}" -d extracted

          if [ ! -f extracted/CipherScan/app/build.gradle ]; then
            echo "CipherScan project was not found inside the ZIP."
            exit 1
          fi

      - name: Restore signing key when available
        env:
          KEY_DATA: ${{ secrets.CIPHER_NEST_KEYSTORE }}
        shell: bash
        run: |
          if [ -n "$KEY_DATA" ]; then
            printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/cipherscan.p12"
            chmod 600 "$RUNNER_TEMP/cipherscan.p12"
            echo "CIPHER_KEYSTORE_PATH=$RUNNER_TEMP/cipherscan.p12" >> "$GITHUB_ENV"
            echo "SCAN_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "SCAN_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Test and build APK
        working-directory: extracted/CipherScan
        shell: bash
        run: |
          export SCAN_VERSION_CODE=$(( $(date +%s) / 60 ))

          mkdir -p "$RUNNER_TEMP/cipherscan-tests"

          javac -d "$RUNNER_TEMP/cipherscan-tests" \
            app/src/main/java/com/cipherscan/network/Ipv4.java \
            tests/Ipv4Test.java

          java -cp "$RUNNER_TEMP/cipherscan-tests" \
            com.cipherscan.network.Ipv4Test

          if [ "$SCAN_VARIANT" = release ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify and copy APK
        shell: bash
        run: |
          APK="extracted/CipherScan/app/build/outputs/apk/$SCAN_VARIANT/app-$SCAN_VARIANT.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

          cp "$APK" CipherScan.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cipherscan.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: CipherScan-APK
          path: CipherScan.apk
          if-no-files-found: error
