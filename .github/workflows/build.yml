name: Build Cipher Scan APK and AAB

on:
  workflow_dispatch:
    inputs:
      mac_test:
        description: Build experimental MAC Test app
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/build.gradle ]; then
            PROJECT="$GITHUB_WORKSPACE"
          elif [ -f CipherScan/app/build.gradle ]; then
            PROJECT="$GITHUB_WORKSPACE/CipherScan"
          else
            if [ ! -f CipherScan_Project.zip ]; then
              echo "CipherScan_Project.zip is missing."
              exit 1
            fi

            unzip -q CipherScan_Project.zip -d extracted
            PROJECT="$GITHUB_WORKSPACE/extracted/CipherScan"
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "Android project not found."
            exit 1
          fi

          echo "SCAN_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Restore existing signing key
        env:
          KEY_DATA: ${{ secrets.CIPHER_SCAN_KEYSTORE || secrets.CIPHER_NEST_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$KEY_DATA" ]; then
            echo "Signing secret is missing."
            echo "Add your ORIGINAL key as CIPHER_SCAN_KEYSTORE."
            echo "Do not generate a replacement key for an existing installation."
            exit 1
          fi

          printf '%s' "$KEY_DATA" |
            base64 --decode > "$RUNNER_TEMP/cipherscan.p12"

          echo "CIPHER_KEYSTORE_PATH=$RUNNER_TEMP/cipherscan.p12" >> "$GITHUB_ENV"

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SCAN_PROJECT"

          cc -Wall -Wextra -Werror \
            tests/neighbor_core_test.c \
            app/src/main/cpp/neighbor_core.c \
            -o "$RUNNER_TEMP/cipher-neighbor-test"

          "$RUNNER_TEMP/cipher-neighbor-test"

          TEST_DIR="$RUNNER_TEMP/cipherscan-tests"
          SRC="app/src/main/java/com/cipherscan/network"

          mkdir -p "$TEST_DIR"

          javac -d "$TEST_DIR" \
            "$SRC/Ipv4.java" \
            "$SRC/DeviceFilter.java" \
            "$SRC/WifiChannels.java" \
            "$SRC/NeighborParser.java" \
            "$SRC/WifiLabels.java" \
            tests/Ipv4Test.java \
            tests/DeviceFilterTest.java \
            tests/WifiChannelsTest.java \
            tests/NeighborParserTest.java \
            tests/WifiLabelsTest.java

          for TEST in \
            Ipv4Test \
            DeviceFilterTest \
            WifiChannelsTest \
            NeighborParserTest \
            WifiLabelsTest
          do
            java -cp "$TEST_DIR" \
              "com.cipherscan.network.$TEST"
          done

      - name: Build release APK and AAB
        env:
          SCAN_MAC_TEST: ${{ inputs.mac_test && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SCAN_PROJECT"

          export SCAN_VERSION_CODE=$(( $(date +%s) / 60 ))

          gradle --no-daemon \
            lintRelease \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease

      - name: Verify and copy APK
        env:
          MAC_TEST: ${{ inputs.mac_test && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$SCAN_PROJECT/app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify "$APK"

          if [ "$MAC_TEST" = true ]; then
            cp "$APK" "$GITHUB_WORKSPACE/CipherScan-MAC-Test.apk"
          else
            cp "$APK" "$GITHUB_WORKSPACE/CipherScan.apk"
          fi

      - name: Verify and copy Play Store AAB
        if: ${{ !inputs.mac_test }}
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$SCAN_PROJECT/app/build/outputs/bundle/release/app-release.aab"

          test -s "$BUNDLE"
          jarsigner -verify "$BUNDLE"

          cp "$BUNDLE" "$GITHUB_WORKSPACE/CipherScan-Play.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mac_test && 'CipherScan-MAC-Test-APK' || 'CipherScan-APK' }}
          path: CipherScan*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        if: ${{ !inputs.mac_test }}
        uses: actions/upload-artifact@v4
        with:
          name: CipherScan-Play-AAB
          path: CipherScan-Play.aab
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cipherscan.p12"
